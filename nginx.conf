worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_hub_user_email":"$http_x_hub_user_email"}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Temp paths writable by non-root
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen $PORT default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Health check at root — Cloud Run probes hit absolute /healthz
        location = /healthz {
            access_log off;
            return 200 '{"ok":true}';
            add_header Content-Type application/json;
        }

        # Serve static files, fall back to index.html for SPA-like behavior
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|json|csv|woff2?)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
}
