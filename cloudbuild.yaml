steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE}'

images:
  - '${_IMAGE}'

substitutions:
  _IMAGE: 'us-west1-docker.pkg.dev/${PROJECT_ID}/copart-external-sentiment/copart-external-sentiment:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
